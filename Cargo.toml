[package]
name = "puck"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Dynamically structured notes from the bottom up."
repository = "https://github.com/trippwill/puck"
default-run = "puck"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
iced = { version = "0.14.0", features = ["tokio", "markdown"] }
rfd = { version = "0.16.0", default-features = false, features = ["xdg-portal", "tokio"] }
rust-embed = "8.8.0"
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-rusqlite = { git = "https://github.com/trippwill/tokio-rusqlite.git", tag = "v0.7.0-0.40.1", version = "0.7.0", features = ["bundled", "uuid", "time", "backup"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v7"] }

[dev-dependencies]
iced_test = "0.14.0"
